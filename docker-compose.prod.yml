# ─────────────────────────────────────────────────────────────
# docker-compose.prod.yml — Production Orchestration
# ─────────────────────────────────────────────────────────────
name: convocore-prod

services:

  # ─────────────────────────────────────────
  # Nginx — Reverse Proxy + SSL Termination
  # ─────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: convocore_nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - convocore_network

  # ─────────────────────────────────────────
  # AdonisJS Application
  # ─────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: production
    container_name: convocore_app
    restart: always
    expose:
      - '3333'
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3333/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - convocore_network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '5'

  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: convocore_postgres
    restart: always
    expose:
      - '5432'                          # NOT exposed to host in prod
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - convocore_network
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ─────────────────────────────────────────
  # Redis — Rate Limiting + SSE + Cache
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: convocore_redis
    restart: always
    expose:
      - '6379'                          # NOT exposed to host in prod
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - convocore_network
    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '3'

  # ─────────────────────────────────────────
  # Certbot — SSL Certificate Renewal
  # ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: convocore_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    networks:
      - convocore_network

# ─────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_www:
    driver: local
  certbot_certs:
    driver: local

# ─────────────────────────────────────────
# Network
# ─────────────────────────────────────────
networks:
  convocore_network:
    driver: bridge
