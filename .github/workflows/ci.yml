# ─────────────────────────────────────────────────────────────
# ci.yml — Continuous Integration
# Runs on every push and pull request
# ─────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: 🧪 Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chat_app_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔑 Create test env
        run: |
          cp .env.example .env.test
          echo "NODE_ENV=test"              >> .env.test
          echo "PORT=3334"                  >> .env.test
          echo "HOST=localhost"             >> .env.test
          echo "APP_KEY=test-app-key-32chars-minimum-here" >> .env.test
          echo "SESSION_DRIVER=memory"      >> .env.test
          echo "DB_HOST=localhost"          >> .env.test
          echo "DB_PORT=5432"               >> .env.test
          echo "DB_USER=postgres"           >> .env.test
          echo "DB_PASSWORD=postgres"       >> .env.test
          echo "DB_DATABASE=chat_app_test"  >> .env.test
          echo "REDIS_HOST=localhost"       >> .env.test
          echo "REDIS_PORT=6379"            >> .env.test
          echo "JWT_SECRET=test-jwt-secret-minimum-32-chars-long" >> .env.test
          echo "JWT_ACCESS_EXPIRES_IN=15m"  >> .env.test
          echo "JWT_REFRESH_EXPIRES_IN=7d"  >> .env.test

      - name: 🗄️ Run migrations
        run: node ace migration:run --force
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_DATABASE: chat_app_test

      - name: 🧪 Run integration tests
        run: node ace test integration
        env:
          NODE_ENV: test
          PORT: 3334
          DB_DATABASE: chat_app_test

      - name: 🔍 Type check
        run: npm run typecheck

  build:
    name: 🏗️ Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build production
        run: npm run build

      - name: ✅ Verify build output
        run: |
          test -f build/bin/server.js && echo "✅ server.js exists" || exit 1

  docker:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/convocore:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/convocore:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
