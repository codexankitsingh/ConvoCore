# ─────────────────────────────────────────────────────────────
# docker-compose.test.yml — Isolated Test Environment
# ─────────────────────────────────────────────────────────────
name: chat-app-test

services:
  app_test:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
      target: development
    container_name: chat_app_test
    environment:
      - NODE_ENV=test
    env_file:
      - .env.test
    depends_on:
      postgres_test:
        condition: service_healthy
    networks:
      - chat_test_network
    command: node ace test

  postgres_test:
    image: postgres:16-alpine
    container_name: chat_postgres_test
    environment:
      POSTGRES_DB: chat_app_test
      POSTGRES_USER: chat_user
      POSTGRES_PASSWORD: chat_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_user -d chat_app_test"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chat_test_network

networks:
  chat_test_network:
    driver: bridge
